# ==========================================
# GRAFANA DATASOURCES
# ==========================================

apiVersion: 1

datasources:

  # ========================================
  # PROMETHEUS - METRICS
  # ========================================

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

    jsonData:
      httpMethod: POST
      timeInterval: 15s

  # ========================================
  # LOKI - LOG MANAGEMENT
  # ========================================

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false

    jsonData:
      maxLines: 1000