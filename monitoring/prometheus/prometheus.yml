
# ==========================================
# E-COMMERCE DEVOPS - PROMETHEUS
# ==========================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # ========================================
  # PROMETHEUS SELF MONITORING
  # ========================================

  - job_name: 'prometheus'

    metrics_path: /metrics

    static_configs:
      - targets:
          - 'prometheus:9090'

        labels:
          category: monitoring
          service: prometheus


  # ========================================
  # CADVISOR - CONTAINER MONITORING
  # ========================================

  - job_name: 'cadvisor'

    metrics_path: /metrics

    static_configs:
      - targets:
          - 'cadvisor:8080'

        labels:
          category: container
          service: cadvisor


  # ========================================
  # MYSQL DATABASE MONITORING
  # ========================================

  - job_name: 'mysql'

    metrics_path: /metrics

    static_configs:
      - targets:
          - 'mysqld-exporter:9104'

        labels:
          category: database
          service: mysql


  # ========================================
  # NGINX WEB SERVER MONITORING
  # ========================================

  - job_name: 'nginx'

    metrics_path: /metrics

    static_configs:
      - targets:
          - 'nginx-exporter:9113'

        labels:
          category: web
          service: nginx


  # ========================================
  # LOKI LOG STORAGE MONITORING
  # ========================================

  - job_name: 'loki'

    metrics_path: /metrics

    static_configs:
      - targets:
          - 'loki:3100'

        labels:
          category: logging
          service: loki


  # ========================================
  # PROMTAIL LOG COLLECTION MONITORING
  # ========================================

  - job_name: 'promtail'

    metrics_path: /metrics

    static_configs:
      - targets:
          - 'promtail:9080'

        labels:
          category: logging
          service: promtail
