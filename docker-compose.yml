
name: ecommerce-devops-new

services:

  # ========================================
  # MYSQL DATABASE
  # ========================================

  mysql:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - database_network

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s


  # ========================================
  # PHPMYADMIN
  # ========================================

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://localhost:8443/phpmyadmin/

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - database_network
      - application_network

    security_opt:
      - no-new-privileges:true


  # ========================================
  # BACKEND NODE.JS
  # ========================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: ecommerce-backend:1.0
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ecommerce
      DB_USER: ecommerce_app
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - database_network
      - application_network

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


  # ========================================
  # NGINX HTTPS REVERSE PROXY
  # ========================================

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      # HTTP -> HTTPS
      - "127.0.0.1:8085:80"

      # Main HTTPS website
      - "127.0.0.1:8443:443"

      # cAdvisor via Nginx HTTPS
      - "127.0.0.1:8444:8444"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - application_network

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD-SHELL
        - "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


  # ========================================
  # PROMETHEUS MONITORING
  # ========================================

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle

      # Prometheus behind Nginx subpath
      - --web.external-url=https://localhost:8443/prometheus/
      - --web.route-prefix=/

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - application_network

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:9090/-/healthy
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


  # ========================================
  # CADVISOR CONTAINER MONITORING
  # ========================================

  cadvisor:
    image: ghcr.io/google/cadvisor:0.57.0
    restart: unless-stopped

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    command:
      - --housekeeping_interval=15s

    networks:
      - application_network

    security_opt:
      - no-new-privileges:true


  # ========================================
  # NGINX PROMETHEUS EXPORTER
  # ========================================

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped

    command:
      - --nginx.scrape-uri=http://nginx:8081/nginx_status

    depends_on:
      nginx:
        condition: service_healthy

    networks:
      - application_network

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL


  # ========================================
  # MYSQL PROMETHEUS EXPORTER
  # ========================================

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    restart: unless-stopped

    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter

    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD is required}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - database_network
      - application_network

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL


  # ========================================
  # GRAFANA MONITORING DASHBOARD
  # ========================================

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}

      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"

      GF_SERVER_ROOT_URL: https://localhost:8443/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

    networks:
      - application_network

    security_opt:
      - no-new-privileges:true


  # ========================================
  # LOKI LOG AGGREGATION
  # ========================================

  loki:
    image: grafana/loki:3.7.0
    restart: unless-stopped

    command:
      - -config.file=/etc/loki/loki-config.yml

    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

    networks:
      - application_network

    security_opt:
      - no-new-privileges:true


  # ========================================
  # PROMTAIL LOG COLLECTION
  # ========================================

  promtail:
    image: grafana/promtail:3.5.0
    restart: unless-stopped

    command:
      - -config.file=/etc/promtail/promtail-config.yml

    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_data:/tmp

    depends_on:
      - loki

    networks:
      - application_network

    security_opt:
      - no-new-privileges:true


# ==========================================
# NETWORKS
# ==========================================

networks:

  database_network:
    driver: bridge
    internal: true

  application_network:
    driver: bridge


# ==========================================
# VOLUMES
# ==========================================

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:
