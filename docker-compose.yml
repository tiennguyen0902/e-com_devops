name: ecommerce-devops-new

services:

  # ========================================
  # MYSQL DATABASE
  # ========================================

  mysql:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - database_network

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s


  # ========================================
  # PHPMYADMIN
  # ========================================

    # ========================================
  # PHPMYADMIN
  # ========================================

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "127.0.0.1:8086:80"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - database_network
      - application_network

    security_opt:
      - no-new-privileges:true


  # ========================================
  # BACKEND NODE.JS
  # ========================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: ecommerce-backend:1.0

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ecommerce
      DB_USER: ecommerce_app
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - database_network
      - application_network

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


  # ========================================
  # NGINX REVERSE PROXY
  # ========================================

    # ========================================
  # NGINX HTTPS REVERSE PROXY
  # ========================================

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      # HTTP - Redirect to HTTPS
      - "127.0.0.1:8085:80"

      # HTTPS
      - "127.0.0.1:8443:443"

    volumes:
      # Nginx configuration
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

      # Frontend
      - ./frontend:/usr/share/nginx/html:ro

      # SSL certificates
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - application_network

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD-SHELL
        - "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


# ==========================================
# NETWORKS
# ==========================================

networks:

  database_network:
    driver: bridge
    internal: true

  application_network:
    driver: bridge


# ==========================================
# VOLUMES
# ==========================================

volumes:

  mysql_data: