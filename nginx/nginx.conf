# ==========================================
# E-COMMERCE NGINX - HTTPS
# ==========================================

# HTTP -> HTTPS
server {
    listen 80;
    server_name localhost;

    server_tokens off;

    return 301 https://$host:8443$request_uri;
}


# ==========================================
# HTTPS SERVER
# ==========================================

server {
    listen 443 ssl;
    server_name localhost;

    server_tokens off;

    # SSL Certificates
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # TLS Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Frontend
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ======================================
    # SECURITY HEADERS
    # ======================================

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Request size limit
    client_max_body_size 1m;

    # ======================================
    # FRONTEND
    # ======================================

    location / {
        try_files $uri $uri/ =404;
    }

    # ======================================
    # BACKEND API
    # ======================================

    location /api/ {
        proxy_pass http://backend:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ======================================
    # HEALTHCHECK
    # ======================================

    location = /health {
        proxy_pass http://backend:3000/health;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================================
    # STATIC FILES
    # ======================================

    location /css/ {
        try_files $uri =404;
        expires 1h;
    }

    location /js/ {
        try_files $uri =404;
        expires 1h;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    # ======================================
    # NGINX STATUS
    # ======================================

    location = /nginx_status {
        stub_status;
        access_log off;

        allow 127.0.0.1;
        deny all;
    }
}