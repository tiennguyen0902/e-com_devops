
# ==========================================
# E-COMMERCE NGINX - HTTPS REVERSE PROXY
# ==========================================


# ==========================================
# HTTP -> HTTPS
# ==========================================

server {
    listen 80;
    server_name localhost;

    server_tokens off;

    return 301 https://$host:8443$request_uri;
}


# ==========================================
# MAIN HTTPS SERVER
# ==========================================

server {
    listen 443 ssl;
    server_name localhost;

    server_tokens off;

    # ======================================
    # SSL / TLS
    # ======================================

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;


    # ======================================
    # FRONTEND
    # ======================================

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    client_max_body_size 1m;


    # ======================================
    # SECURITY HEADERS
    # ======================================

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;


    # ======================================
    # WEBSITE
    # ======================================

    location / {
        try_files $uri $uri/ =404;
    }


    # ======================================
    # BACKEND API
    # ======================================

    location /api/ {
        proxy_pass http://backend:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }


    # ======================================
    # BACKEND HEALTHCHECK
    # ======================================

    location = /health {
        proxy_pass http://backend:3000/health;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ======================================
    # GRAFANA REDIRECT
    # ======================================

    location = /grafana {
        return 301 https://$http_host/grafana/;
    }


    # ======================================
    # GRAFANA REVERSE PROXY
    # ======================================

    location /grafana/ {
        proxy_pass http://grafana:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }


    # ======================================
    # PHPMYADMIN REDIRECT
    # ======================================

    location = /phpmyadmin {
        return 301 https://$http_host/phpmyadmin/;
    }


    # ======================================
    # PHPMYADMIN REVERSE PROXY
    # ======================================

    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin:80/;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Script-Name /phpmyadmin;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }


    # ======================================
    # PROMETHEUS REDIRECT
    # ======================================

    location = /prometheus {
        return 301 https://$http_host/prometheus/;
    }


    # ======================================
    # PROMETHEUS REVERSE PROXY
    # ======================================

    location /prometheus/ {
        proxy_pass http://prometheus:9090/;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }


    # ======================================
    # STATIC CSS
    # ======================================

    location /css/ {
        try_files $uri =404;
        expires 1h;
    }


    # ======================================
    # STATIC JAVASCRIPT
    # ======================================

    location /js/ {
        try_files $uri =404;
        expires 1h;
    }


    # ======================================
    # STATIC ASSETS
    # ======================================

    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }


    # ======================================
    # NGINX STATUS - LOCAL ONLY
    # ======================================

    location = /nginx_status {
        stub_status;
        access_log off;

        allow 127.0.0.1;
        deny all;
    }
}


# ==========================================
# CADVISOR HTTPS REVERSE PROXY
# ==========================================

server {
    listen 8444 ssl;
    server_name localhost;

    server_tokens off;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://cadvisor:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}


# ==========================================
# INTERNAL NGINX MONITORING
# ==========================================

server {
    listen 8081;
    server_name _;

    server_tokens off;

    location = /nginx_status {
        stub_status;
        access_log off;
    }

    location / {
        return 404;
    }
}
